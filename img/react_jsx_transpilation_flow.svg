<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradJsx" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141820" />
      <stop offset="100%" stop-color="#0f1218" />
    </linearGradient>
    <linearGradient id="jsxCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(97, 218, 251, 0.14)" />
      <stop offset="100%" stop-color="rgba(97, 218, 251, 0.04)" />
    </linearGradient>
    <linearGradient id="compilerCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 153, 0, 0.16)" />
      <stop offset="100%" stop-color="rgba(255, 153, 0, 0.05)" />
    </linearGradient>
    <linearGradient id="jsCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(46, 204, 113, 0.15)" />
      <stop offset="100%" stop-color="rgba(46, 204, 113, 0.05)" />
    </linearGradient>
    <marker id="arrowFlow1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ff9900" />
    </marker>
    <marker id="arrowFlow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2ecc71" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="390" rx="12" fill="url(#bgGradJsx)" stroke="#2d333b" stroke-width="1.5" />

  <!-- Title -->
  <text x="480" y="36" fill="#ffffff" font-family="Inter, sans-serif" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="0.5">
    POR BAIXO DOS PANOS: COMO O JSX É TRANSFORMADO EM JAVASCRIPT PURO
  </text>
  <line x1="50" y1="50" x2="910" y2="50" stroke="#2d333b" stroke-width="1" />

  <!-- Step 1: JSX Code Written by Dev -->
  <rect x="30" y="72" width="295" height="290" rx="10" fill="url(#jsxCard)" stroke="#61dafb" stroke-width="1.5" />
  <text x="177" y="98" fill="#61dafb" font-family="Inter, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
    1. CÓDIGO JSX (Escrito no .jsx)
  </text>
  <line x1="48" y1="108" x2="307" y2="108" stroke="rgba(97, 218, 251, 0.3)" stroke-width="1" />

  <text x="46" y="132" fill="#9ca3af" font-family="Fira Code, monospace" font-size="10.5">
    // Comentário JS (Fora do return)
  </text>
  <text x="46" y="150" fill="#e5e7eb" font-family="Fira Code, monospace" font-size="11">
    const usuario = "Eduardo";
  </text>
  <text x="46" y="174" fill="#e5e7eb" font-family="Fira Code, monospace" font-size="11">
    return (
  </text>
  <text x="58" y="194" fill="#61dafb" font-family="Fira Code, monospace" font-size="11">
    &lt;div <tspan fill="#ffd700">className</tspan>="card"&gt;
  </text>
  <text x="70" y="214" fill="#6b7280" font-family="Fira Code, monospace" font-size="10.5">
    {/* Comentário JSX */}
  </text>
  <text x="70" y="234" fill="#61dafb" font-family="Fira Code, monospace" font-size="11">
    &lt;label <tspan fill="#ffd700">htmlFor</tspan>="user"&gt;
  </text>
  <text x="84" y="254" fill="#2ecc71" font-family="Fira Code, monospace" font-size="11" font-weight="600">
    {usuario}
  </text>
  <text x="70" y="274" fill="#61dafb" font-family="Fira Code, monospace" font-size="11">
    &lt;/label&gt;
  </text>
  <text x="70" y="294" fill="#61dafb" font-family="Fira Code, monospace" font-size="11">
    &lt;input id="user" <tspan fill="#ff6b6b">/&gt;</tspan>
  </text>
  <text x="58" y="314" fill="#61dafb" font-family="Fira Code, monospace" font-size="11">
    &lt;/div&gt;
  </text>
  <text x="46" y="334" fill="#e5e7eb" font-family="Fira Code, monospace" font-size="11">
    );
  </text>

  <!-- Arrow 1 -->
  <path d="M 325 215 L 368 215" fill="none" stroke="#ff9900" stroke-width="2.5" marker-end="url(#arrowFlow1)" />

  <!-- Step 2: Transpiler (Vite / esbuild / Babel) -->
  <rect x="375" y="72" width="210" height="290" rx="10" fill="url(#compilerCard)" stroke="#ff9900" stroke-width="1.5" />
  <text x="480" y="98" fill="#ff9900" font-family="Inter, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
    2. TRANSPILADOR
  </text>
  <text x="480" y="115" fill="#ffd280" font-family="Fira Code, monospace" font-size="10.5" text-anchor="middle">
    (esbuild / Babel no Vite)
  </text>
  <line x1="392" y1="125" x2="568" y2="125" stroke="rgba(255, 153, 0, 0.3)" stroke-width="1" />

  <text x="392" y="152" fill="#ffffff" font-family="Inter, sans-serif" font-size="11.5" font-weight="600">
    Regras Validada na Build:
  </text>
  <text x="392" y="178" fill="#e5e7eb" font-family="Inter, sans-serif" font-size="11">
    ✓ 1 Único Elemento Pai
  </text>
  <text x="392" y="202" fill="#e5e7eb" font-family="Inter, sans-serif" font-size="11">
    ✓ Tags fechadas (&lt;input /&gt;)
  </text>
  <text x="392" y="226" fill="#e5e7eb" font-family="Inter, sans-serif" font-size="11">
    ✓ className &amp; htmlFor
  </text>
  <text x="392" y="250" fill="#e5e7eb" font-family="Inter, sans-serif" font-size="11">
    ✓ Atributos em camelCase
  </text>
  <text x="392" y="274" fill="#e5e7eb" font-family="Inter, sans-serif" font-size="11">
    ✓ Avalia expressões { }
  </text>
  <text x="392" y="298" fill="#e5e7eb" font-family="Inter, sans-serif" font-size="11">
    ✓ Remove {/* comentários */}
  </text>
  <rect x="392" y="316" width="176" height="30" rx="6" fill="rgba(0,0,0,0.35)" stroke="rgba(255,153,0,0.4)" />
  <text x="480" y="335" fill="#ffd700" font-family="Fira Code, monospace" font-size="10" text-anchor="middle">
    Converte em chamadas JS
  </text>

  <!-- Arrow 2 -->
  <path d="M 585 215 L 628 215" fill="none" stroke="#2ecc71" stroke-width="2.5" marker-end="url(#arrowFlow2)" />

  <!-- Step 3: Pure JS Output (React.createElement) -->
  <rect x="635" y="72" width="295" height="290" rx="10" fill="url(#jsCard)" stroke="#2ecc71" stroke-width="1.5" />
  <text x="782" y="98" fill="#2ecc71" font-family="Inter, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
    3. JAVASCRIPT PURO (Navegador)
  </text>
  <line x1="653" y1="108" x2="912" y2="108" stroke="rgba(46, 204, 113, 0.3)" stroke-width="1" />

  <text x="650" y="134" fill="#9ca3af" font-family="Fira Code, monospace" font-size="10.5">
    // Chamada gerada nos bastidores:
  </text>
  <text x="650" y="156" fill="#2ecc71" font-family="Fira Code, monospace" font-size="10.8" font-weight="600">
    React.createElement(
  </text>
  <text x="664" y="176" fill="#ffd700" font-family="Fira Code, monospace" font-size="10.8">
    "div",
  </text>
  <text x="664" y="196" fill="#e5e7eb" font-family="Fira Code, monospace" font-size="10.8">
    { className: "card" },
  </text>
  <text x="664" y="216" fill="#61dafb" font-family="Fira Code, monospace" font-size="10.8">
    React.createElement(
  </text>
  <text x="678" y="236" fill="#e5e7eb" font-family="Fira Code, monospace" font-size="10.5">
    "label", { htmlFor: "user" },
  </text>
  <text x="678" y="254" fill="#2ecc71" font-family="Fira Code, monospace" font-size="10.5">
    usuario
  </text>
  <text x="664" y="272" fill="#61dafb" font-family="Fira Code, monospace" font-size="10.8">
    ),
  </text>
  <text x="664" y="292" fill="#61dafb" font-family="Fira Code, monospace" font-size="10.8">
    React.createElement(
  </text>
  <text x="678" y="310" fill="#e5e7eb" font-family="Fira Code, monospace" font-size="10.5">
    "input", { id: "user" }
  </text>
  <text x="664" y="328" fill="#61dafb" font-family="Fira Code, monospace" font-size="10.8">
    )
  </text>
  <text x="650" y="346" fill="#2ecc71" font-family="Fira Code, monospace" font-size="10.8" font-weight="600">
    );
  </text>
</svg>
