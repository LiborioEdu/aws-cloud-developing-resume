<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141820" />
      <stop offset="100%" stop-color="#0f1218" />
    </linearGradient>
    <linearGradient id="synthGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(97, 218, 251, 0.16)" />
      <stop offset="100%" stop-color="rgba(52, 152, 219, 0.05)" />
    </linearGradient>
    <linearGradient id="okGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(46, 204, 113, 0.14)" />
      <stop offset="100%" stop-color="rgba(46, 204, 113, 0.04)" />
    </linearGradient>
    <linearGradient id="warnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 153, 0, 0.15)" />
      <stop offset="100%" stop-color="rgba(255, 153, 0, 0.05)" />
    </linearGradient>
    <marker id="arrowCyan3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#61dafb" />
    </marker>
    <marker id="arrowGreen3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2ecc71" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="440" rx="12" fill="url(#bgGrad3)" stroke="#2d333b" stroke-width="1.5" />

  <!-- Title -->
  <text x="480" y="34" fill="#ffffff" font-family="Inter, sans-serif" font-size="15.5" font-weight="700" text-anchor="middle" letter-spacing="0.5">
    ARQUITETURA DE INTERATIVIDADE: SYNTHETIC EVENTS E PASSAGEM DE FUNÇÕES NO JSX
  </text>
  <line x1="50" y1="48" x2="910" y2="48" stroke="#2d333b" stroke-width="1" />

  <!-- Top Section: Synthetic Event Wrapper Flow -->
  <rect x="35" y="64" width="250" height="92" rx="8" fill="#181c24" stroke="#4b5563" stroke-width="1.5" />
  <text x="160" y="88" fill="#e5e7eb" font-family="Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">
    1. AÇÃO DO USUÁRIO (Browsers)
  </text>
  <text x="160" y="110" fill="#9ca3af" font-family="Fira Code, monospace" font-size="10.5" text-anchor="middle">
    Chrome | Firefox | Safari | Edge
  </text>
  <text x="160" y="134" fill="#61dafb" font-family="Fira Code, monospace" font-size="11" text-anchor="middle">
    Evento Nativo do DOM (click, input)
  </text>

  <path d="M 285 110 L 338 110" fill="none" stroke="#61dafb" stroke-width="2" marker-end="url(#arrowCyan3)" />

  <rect x="345" y="64" width="275" height="92" rx="8" fill="url(#synthGrad)" stroke="#61dafb" stroke-width="1.5" />
  <text x="482" y="88" fill="#61dafb" font-family="Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">
    2. REACT SYNTHETIC EVENT (e)
  </text>
  <text x="482" y="110" fill="#e5e7eb" font-family="Inter, sans-serif" font-size="10.8" text-anchor="middle">
    Camada Cross-Browser Padronizada
  </text>
  <text x="482" y="134" fill="#ffd700" font-family="Fira Code, monospace" font-size="10.8" text-anchor="middle">
    e.target.value | e.preventDefault()
  </text>

  <path d="M 620 110 L 673 110" fill="none" stroke="#2ecc71" stroke-width="2" marker-end="url(#arrowGreen3)" />

  <rect x="680" y="64" width="245" height="92" rx="8" fill="url(#okGrad)" stroke="#2ecc71" stroke-width="1.5" />
  <text x="802" y="88" fill="#2ecc71" font-family="Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">
    3. HANDLER DO COMPONENTE
  </text>
  <text x="802" y="110" fill="#e5e7eb" font-family="Fira Code, monospace" font-size="10.8" text-anchor="middle">
    onClick / onChange / onSubmit
  </text>
  <text x="802" y="134" fill="#9ca3af" font-family="Inter, sans-serif" font-size="10.8" text-anchor="middle">
    Executa a lógica JavaScript
  </text>

  <!-- Divider -->
  <line x1="35" y1="176" x2="925" y2="176" stroke="#2d333b" stroke-width="1" stroke-dasharray="4 4" />
  <text x="480" y="198" fill="#ffd700" font-family="Inter, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
    OS 3 CENÁRIOS DE LIGAÇÃO DE FUNÇÕES EM EVENTOS (AULA 31)
  </text>

  <!-- Card 1: Sem Argumentos (Referência Direta) -->
  <rect x="35" y="214" width="284" height="202" rx="8" fill="url(#okGrad)" stroke="#2ecc71" stroke-width="1.5" />
  <text x="177" y="238" fill="#2ecc71" font-family="Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">
    CENÁRIO A: SEM ARGUMENTOS
  </text>
  <line x1="50" y1="248" x2="304" y2="248" stroke="rgba(46,204,113,0.3)" />
  <text x="50" y="270" fill="#e5e7eb" font-family="Inter, sans-serif" font-size="11" font-weight="600">
    ✅ CORRETO (Por Referência):
  </text>
  <text x="50" y="290" fill="#2ecc71" font-family="Fira Code, monospace" font-size="10.8">
    onClick={lidarComClique}
  </text>
  <text x="50" y="310" fill="#9ca3af" font-family="Inter, sans-serif" font-size="10.2">
    Só executa quando o usuário clicar.
  </text>

  <text x="50" y="342" fill="#ff6b6b" font-family="Inter, sans-serif" font-size="11" font-weight="600">
    ❌ ERRADO (Com Parênteses):
  </text>
  <text x="50" y="362" fill="#ff6b6b" font-family="Fira Code, monospace" font-size="10.8">
    onClick={lidarComClique()}
  </text>
  <text x="50" y="382" fill="#9ca3af" font-family="Inter, sans-serif" font-size="10.2">
    Dispara sozinho ao abrir a tela!
  </text>

  <!-- Card 2: Com Argumentos (Arrow Function Inline) -->
  <rect x="338" y="214" width="284" height="202" rx="8" fill="url(#warnGrad)" stroke="#ff9900" stroke-width="1.5" />
  <text x="480" y="238" fill="#ff9900" font-family="Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">
    CENÁRIO B: COM ARGUMENTOS
  </text>
  <line x1="353" y1="248" x2="607" y2="248" stroke="rgba(255,153,0,0.3)" />
  <text x="353" y="270" fill="#e5e7eb" font-family="Inter, sans-serif" font-size="11" font-weight="600">
    ✅ CORRETO (Arrow Anônima):
  </text>
  <text x="353" y="290" fill="#ffd700" font-family="Fira Code, monospace" font-size="10.2">
    onClick={() =&gt; saudar("Eduardo")}
  </text>
  <text x="353" y="310" fill="#9ca3af" font-family="Inter, sans-serif" font-size="10.2">
    A arrow function envelopa a chamada
  </text>
  <text x="353" y="326" fill="#9ca3af" font-family="Inter, sans-serif" font-size="10.2">
    e aguarda o clique acontecer.
  </text>

  <text x="353" y="356" fill="#ff6b6b" font-family="Inter, sans-serif" font-size="11" font-weight="600">
    ❌ ERRADO (Execução Direta):
  </text>
  <text x="353" y="376" fill="#ff6b6b" font-family="Fira Code, monospace" font-size="10.2">
    onClick={saudar("Eduardo")}
  </text>
  <text x="353" y="396" fill="#9ca3af" font-family="Inter, sans-serif" font-size="10.2">
    Executa durante a renderização!
  </text>

  <!-- Card 3: Capturando Objeto de Evento (e) -->
  <rect x="641" y="214" width="284" height="202" rx="8" fill="url(#synthGrad)" stroke="#61dafb" stroke-width="1.5" />
  <text x="783" y="238" fill="#61dafb" font-family="Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">
    CENÁRIO C: OBJETO DE EVENTO (e)
  </text>
  <line x1="656" y1="248" x2="910" y2="248" stroke="rgba(97,218,251,0.3)" />
  <text x="656" y="270" fill="#e5e7eb" font-family="Inter, sans-serif" font-size="11" font-weight="600">
    1. Automático por Referência:
  </text>
  <text x="656" y="290" fill="#61dafb" font-family="Fira Code, monospace" font-size="10.5">
    onChange={capturarDigitacao}
  </text>
  <text x="656" y="310" fill="#9ca3af" font-family="Fira Code, monospace" font-size="10">
    const capturar = (e) =&gt; e.target.value
  </text>

  <text x="656" y="342" fill="#e5e7eb" font-family="Inter, sans-serif" font-size="11" font-weight="600">
    2. Combinando (e) + Argumentos:
  </text>
  <text x="656" y="362" fill="#61dafb" font-family="Fira Code, monospace" font-size="10">
    onClick={(e) =&gt; salvar(id, e)}
  </text>
  <text x="656" y="384" fill="#9ca3af" font-family="Inter, sans-serif" font-size="10.2">
    Recebe o evento 'e' na arrow e repassa.
  </text>
</svg>
